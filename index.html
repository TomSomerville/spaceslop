<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaceSlop</title>
  <meta name="description" content="Rockets, spaceflight, space stations, moon bases and orbital manufacturing news, aggregated.">
  <style>
    :root { --bg: #0b0d12; --fg: #e8eaf0; --muted: #8a90a0; --accent: #ff6a2b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    main { max-width: 640px; text-align: center; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0 0 .25em; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Space<span>Slop</span></h1>
    <p>Rockets, launches, space stations, moon bases and orbital manufacturing, pulled from the whole internet into one feed.</p>
    <p>Coming soon.</p>
  </main>
</body>
</html>
