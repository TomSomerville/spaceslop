title: SpaceSlop
tagline: "Rockets, launches, stations, moon bases and orbital industry. Machine-written, source-linked."
description: "Space industry news written by AI from the original reporting: rocketry, spaceflight, space stations, lunar bases and in-space manufacturing."
url: https://spaceslop.beached.lol
baseurl: ""
timezone: UTC
lang: en

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Section labels used in article front matter (category:)
sections:
  launch: Launch
  vehicles: Vehicles
  stations: Stations
  moon: Moon & Mars
  manufacturing: Manufacturing
  industry: Industry
  policy: Policy

exclude:
  - data/
  - scripts/
  - ROUTINE.md
  - README.md
  - CLAUDE.md
  - mockups/
