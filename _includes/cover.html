{% comment %}Image block for a post. include.post = the post, include.size = "card" | "lead" | "hero".
Real photo when the post has `image`; otherwise generated cover art (see art.html).{% endcomment %}{% assign p = include.post %}{% if p.image and p.image.path %}<figure class="cover cover-{{ include.size }}"><img src="{{ p.image.path }}" alt="{{ p.image.alt | default: p.title | escape }}" loading="{% if include.size == 'card' %}lazy{% else %}eager{% endif %}" decoding="async" referrerpolicy="no-referrer">{% if include.size == 'hero' %}<figcaption class="hud">Image: {% if p.image.source_url %}<a href="{{ p.image.source_url }}" rel="noopener" target="_blank">{{ p.image.credit }}</a>{% else %}{{ p.image.credit }}{% endif %}{% if p.image.license %} · {{ p.image.license }}{% endif %}</figcaption>{% endif %}</figure>{% else %}<figure class="cover cover-{{ include.size }} cover-art c-{{ p.category }}">{% include art.html post=p %}<span class="art-tag hud">{{ site.sections[p.category] | default: "Transmission" }}</span>{% if include.size == 'hero' %}<figcaption class="hud">Illustration generated by SpaceSlop · not a photograph</figcaption>{% endif %}</figure>{% endif %}
