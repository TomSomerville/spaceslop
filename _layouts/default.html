<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a class="logo" href="{{ '/' | relative_url }}">Space<span>Slop</span></a>
      <p class="tagline">{{ site.tagline }}</p>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="wrap footer">
    <p>Every article on SpaceSlop is written by AI (Claude) from the linked source reporting. Check the sources before quoting anything.</p>
    <p><a href="{{ '/feed.xml' | relative_url }}">RSS feed</a></p>
  </footer>
</body>
</html>
